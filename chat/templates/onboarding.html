{% extends 'base.html' %}{% block body %}<main class="auth-simple"><a class="brand" href="/"><img class="app-logo" src="/static/chat/logo.svg" width="28" height="28" alt=""> اسنک</a><section class="auth-card"><span class="eyebrow">فضایی برای بهترین کارهای شما</span><h1>فضای کاری تیم شما کجاست؟</h1><p class="muted">برای شروع یک فضای کاری بسازید. دعوت‌نامه دارید؟ پس از ورود، پیوند آن را باز کنید.</p>{% for message in messages %}<p class="errorlist">{{ message }}</p>{% endfor %}<form method="post" action="{% url 'create_workspace' %}">{% csrf_token %}<label for="name">نام فضای کاری</label><input id="name" name="name" maxlength="80" required placeholder="مثلاً استودیوی آفرین"><button class="primary full">ساخت فضای کاری ←</button></form><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-link">خروج از حساب</button></form></section></main>{% endblock %}
