{% extends 'base.html' %}{% block body %}<main class="auth-simple"><a class="brand" href="/">✳ تیم‌فلو</a><section class="auth-card">{% if error %}<h1>دربارهٔ این دعوت‌نامه</h1><p>{{ error }}</p><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="primary">خروج از حساب</button></form>{% else %}<h1>شما دعوت شده‌اید.</h1><p>به {{ invitation.workspace.name }} بپیوندید و گفتگو را شروع کنید.</p><form method="post">{% csrf_token %}<button class="primary full">پیوستن به فضای کاری ←</button></form>{% endif %}<p><a href="/">رفتن به فضای کاری من</a></p></section></main>{% endblock %}
